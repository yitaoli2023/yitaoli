baseURL = "https://yitaoli/"
title = "李一桃 🍑"

theme = "puppet"

copyright = "©2023 Yitao Li"
paginate = 10
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"

hasCJKLanguage = true
enableInlineShortcodes = true
enableEmoji = true
# prevent build failures when using Hugo's Instagram shortcode due to deprecated Instagram API.
# See https://github.com/gohugoio/hugo/issues/7228#issuecomment-714490456
ignoreErrors = ["error-remote-getjson"]

disqusShortname =  "https-yitaoli2023-github-io-yitaoli"
googleAnalytics = "G-040GK8YC1C"

[outputs]
home = ["HTML", "JSON", "RSS"]

# prevent build failures when using Hugo's template _internal/opengraph.html 
[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup]
[markup.highlight]
noClasses = true
codeFences = true
guessSyntax = true
lineNos = true
lineNumbersInTable = false
style = "dracula"

[markup.goldmark.renderer]
unsafe = true

[menu]
[[menu.main]]
identifier = "home"
name = "主页"
url = "/"
weight = -100
[[menu.main]]
identifier = "archive"
name = "文章"
url = "/archive/"
weight = 10
[[menu.main]]
identifier = "about"
name = "关于我"
url = "/about/"
weight = 50


